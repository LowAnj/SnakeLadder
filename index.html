/* ---- turn ---- */
function tryRoll(){if(busy||over||!myTurn())return;const v=1+Math.floor(Math.random()*6),d=Math.floor(Math.random()*DARES.length),q=pickQ(),f=Math.floor(Math.random()*3);BM=genBM();
if(online&&room)room.emit('roll',{v,d,q,f,bm:BM});play(v,d,q,f)}
async function play(v,d,q,f){if(busy||over)return;busy=true;ui();const t=turn,p=PL[t];
$('#die').classList.add('shake');for(let i=0;i<10;i++){face(1+Math.floor(Math.random()*6));SFX.tick();await sleep(70)}$('#die').classList.remove('shake');face(v);
const m=mul[t],mv=Math.round(v*m);mul[t]=1;ui();lg(`${p.n} rolled ${v}`+(m>1?` × ${m} = ${mv} spaces!`:'.'));
const goal=Math.min(TOP,pos[t]+mv);const crossed=pos[1-t]>0&&pos[1-t]>pos[t]&&pos[1-t]<=goal;
if(m>1&&goal>pos[t]){lg(`${p.n} gets a boost: ${['Superhero Cape Flight','Sports Car Ride','Spider-Man Web Swing'][(f|0)%3]}!`);await travel(t,pos[t],goal,f);pos[t]=goal}else while(pos[t]<goal){pos[t]++;SFX.step();await tw(t,ctr(pos[t]),150,12)}
if(pos[t]<TOP){const L=LAD[pos[t]],Sn=SNK[pos[t]];
 if(L){lg(`Ladder! ${p.n} climbs ${pos[t]} → ${L}`);SFX.lad();await sleep(250);await tw(t,ctr(L),800,0);pos[t]=L}
 else if(Sn){lg(`Snake head! ${p.n} must do a dare…`);SFX.dare();$('#dt').textContent=DARES[d];
  const mine=myTurn();$('#acc').style.display=mine?'':'none';$('#dw').style.display=mine?'none':'';$('#dm').classList.add('on');
  await waitAcc();$('#dm').classList.remove('on');lg(`Dare done: ${DARES[d]}`);lg(`${p.n} slides ${pos[t]} → ${Sn}`);SFX.snk();await tw(t,ctr(Sn),900,0);pos[t]=Sn}
 if(MUL[pos[t]]){const M=MUL[pos[t]];lg(`${p.n} landed on a ${M}× star! Mini-game time…`);const ok=await mini(M,q);if(ok){mul[t]=M;SFX.mul();lg(`Correct! ${p.n}’s next roll is ${M}×!`)}else lg(`Wrong answer — no multiplier for ${p.n}.`)}}
if(pos[t]>=TOP){win(t);return}
if(SNOW[pos[t]]){await iceRink(t)}if(GUN[pos[t]]){await gunDuel(t)}if(crossed||(pos[0]==pos[1]&&pos[t]>0)){await encounter(t)}turn=1-turn;busy=false;ui();draw()}
function win(t){over=true;busy=false;lg(`${PL[t].n} wins!`);ui();$('#banner').textContent=`${PL[t].n} WINS!`;SFX.win();
const g=$('#wc').getContext('2d');g.clearRect(0,0,48,56);spr(g,PL[t],4,0,0);$('#wt').textContent=`${PL[t].n} WINS!`;$('#ov').classList.add('on');
const cols=['#f5b700','#ff4d6d','#4dd2ff','#7cff6b','#c77dff'];
for(let i=0;i<50;i++){const c=document.createElement('div');c.className='cf';c.style.cssText=`left:${Math.random()*100}%;background:${cols[i%5]};animation-duration:${2+Math.random()*2.5}s;animation-delay:${Math.random()*1.5}s`;$('#ov').appendChild(c)}}
function init(){if(FG)FG.run=false;FG=null;fq.length=0;if(IG)IG.run=false;IG=null;iq.length=0;hp=[3,3];GD=null;EFS.length=0;gq.length=0;FL=[0,0];cv.onpointerdown=cv.onpointermove=null;window.onkeydown=window.onkeyup=null;$('#dp').classList.remove('on');$('#hol').classList.remove('on');pos=[0,0];vis=[ctr(1),ctr(1)];jmp=[0,0];mul=[1,1];turn=0;busy=false;over=false;accRes=null;accPre=false;ansRes=null;ansPre=null;bgm(false);bq=[];bres=null;if(BT)BT.run=false;$('#bt').classList.remove('on');$('#tr').style.display='none';$('#mm').classList.remove('on');
$('#reset').disabled=false;$('#log').innerHTML='';document.querySelectorAll('.cf').forEach(e=>e.remove());$('#ov').classList.remove('on');$('#dm').classList.remove('on');
lg('New game! Land on star tiles to play a mini-game for a 2×/3× multiplier. Snake heads mean DARES!');face(1);ui();draw()}
function doReset(){if(online&&room)room.emit('reset',{});init()}
/* ---- chat ---- */
const AVS={m:{map:'m',shirt:'#2f6fd0',pants:'#24304f'},f:{map:'f',shirt:'#d6336c',pants:'#7a3cb0'}};
const MALE_GLASSES=false; /* set true to give the male avatar clear glasses */
if(MALE_GLASSES){SPR.m[3]='.hgggssgggh.';SPR.m[4]='..gegssgeg..';SPR.m[5]='..gggssggg..'}
function addC(d){const L=$('#cl');L.appendChild(d);L.scrollTop=L.scrollHeight;while(L.children.length>80)L.firstChild.remove()}
function cline(who,txt,c){const d=document.createElement('div');d.className='sys';d.textContent=`${who}: ${txt}`;if(c)d.style.color=c;addC(d)}
function bubble(seat,txt,ts){const p=PL[seat]||PL[0],d=document.createElement('div');d.className='m'+(online&&seat==me?' me':'');
const cvs=document.createElement('canvas');cvs.width=24;cvs.height=28;spr(cvs.getContext('2d'),p,2,0,0);
const b=document.createElement('div'),w=document.createElement('div'),x=document.createElement('div'),t=new Date(ts||Date.now());b.className='bub';w.className='who';
w.textContent=`${p.n} \u00b7 ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;x.textContent=txt;b.append(w,x);d.append(cvs,b);addC(d)}
$('#cf').onsubmit=e=>{e.preventDefault();const t=$('#ci').value.trim().slice(0,160);if(!t)return;$('#ci').value='';if(online&&room)room.emit('chat',{s:me,t});else bubble(0,t)};
function drawCards(){PL.forEach((p,i)=>{const c=$('#s'+i).getContext('2d');c.clearRect(0,0,48,56);spr(c,p,4,0,0)})}
/* ---- firestore transport (event log in rooms/{code}.ev) ---- */
const CID=Math.random().toString(36).slice(2,9);let rdoc=null,unsub=null,evN=0,HOST=null,started=false,lob;const H={};
const RM={on:(t,f)=>{H[t]=f},emit(t,d){const e={id:CID+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),t,f:CID,j:JSON.stringify(d||{}),ts:Date.now(),exp:new Date(Date.now()+864e5)};
return addDoc(collection(rdoc,'ev'),e).catch(x=>cline('SYS','send failed: '+(x.code||x),'#ff8a65'))}};
function listen(code){rdoc=doc(db,'rooms',code);return new Promise(async res=>{let ex=false;try{const g=await getDoc(rdoc);ex=g.exists();if(ex)HOST=g.data().host}catch(x){cline('SYS','firestore error: '+(x.code||x),'#ff8a65')}
if(!ex){res(false);return}
unsub=onSnapshot(collection(rdoc,'ev'),sn=>{const L=sn.docChanges().filter(c=>c.type=='added').map(c=>c.doc.data()).sort((a,b)=>(a.ts-b.ts)||(a.id<b.id?-1:1));
L.forEach(e=>{const h=H[e.t];if(h){try{h({isMe:e.f==CID,from:e.f,ts:e.ts,data:JSON.parse(e.j||'{}')})}catch(x){console.error(x)}}})},err=>cline('SYS','firestore error: '+err.code,'#ff8a65'));res(true)})}
/* ---- lobby ---- */
function lobReset(){lob={s1:null,av:[null,null],rd:[false,false],code:''}}lobReset();
const seatOf=f=>f==HOST?0:f==lob.s1?1:-1;
function lbMsg(t){$('#lbMsg').textContent=t||''}
function lobUI(){const A=$('#lbAv');A.innerHTML='';
[['m','MALE','short curly hair'],['f','FEMALE','voluminous curly hair']].forEach(([k,n,d])=>{const mine=lob.av[me]==k,tk=lob.av[1-me]==k,b=document.createElement('div');b.className='av'+(mine?' sel':'')+(tk?' tk':'');
const c=document.createElement('canvas');c.width=60;c.height=70;spr(c.getContext('2d'),AVS[k],5,0,0);const t=document.createElement('div');t.textContent=n+(tk?' (TAKEN)':'');const u=document.createElement('div');u.textContent=d;u.style.fontSize='6px';
b.append(c,t,u);b.onclick=()=>{if(me==null||tk||lob.rd[me])return;room.emit('pick',{a:k})};A.append(b)});
const st=i=>`P${i+1}${i==me?' (YOU)':''}: `+(i==1&&!lob.s1?'waiting for player...':lob.av[i]?lob.av[i].toUpperCase()+(lob.rd[i]?' - READY':''):'choosing...');
$('#lbSt').innerHTML=st(0)+'<br>'+st(1);$('#lbReady').disabled=me==null||!lob.av[me]||lob.rd[me]||!lob.s1;
$('#mode').textContent=`ONLINE \u00b7 ROOM ${lob.code}`+(me!=null?` \u00b7 YOU ARE P${me+1}`:'')}
function regH(){
room.on('join',m=>{if(m.from!=HOST&&!lob.s1){lob.s1=m.from;if(m.isMe){me=1;online=true}cline('SYS',m.isMe?'you joined as PLAYER 2':'opponent joined the room','#ffd84d');lbMsg('')}else if(m.isMe&&m.from!=HOST&&lob.s1!=CID)lbMsg('ROOM IS FULL');lobUI()});
room.on('pick',m=>{const s=seatOf(m.from);if(s<0||started)return;if(lob.av[1-s]==m.data.a){if(m.isMe)lbMsg('THAT AVATAR IS TAKEN');return}lbMsg('');lob.av[s]=m.data.a;lob.rd[s]=false;lobUI()});
room.on('ready',m=>{const s=seatOf(m.from);if(s<0||started||!lob.av[s])return;lob.rd[s]=true;lobUI();if(lob.rd[0]&&lob.rd[1])startOnline()});
room.on('roll',m=>{if(!m.isMe&&m.data){BM=m.data.bm;play(m.data.v,m.data.d,m.data.q,m.data.f)}});
room.on('accept',m=>{if(m.isMe)return;if(m.data&&m.data.b){gotB(m.data.b);return}if(m.data&&typeof m.data.ok=='boolean')gotAns(m.data.ok);else gotAcc()});
room.on('reset',m=>{if(!m.isMe)init()});
room.on('gun',m=>{if(!GD){gq.push(m);return}gunEv(m)});
room.on('fgt',m=>{if(!FG){fq.push(m);return}fev(m)});
room.on('ice',m=>{if(!IG){iq.push(m);return}iev(m)});
room.on('chat',m=>{if(!m.isMe)SFX.msg();bubble(m.data.s,String(m.data.t).slice(0,160),m.ts)})}
function startOnline(){started=true;PL.forEach((p,i)=>Object.assign(p,AVS[lob.av[i]]));drawCards();$('#lb').classList.remove('on');init();cline('SYS','game started! have fun','#ffd84d')}
function enterRoom(c){lob.code=c;$('#l1').style.display='none';$('#l2').style.display='';$('#lbRc').textContent=c;lobUI();lbMsg(me==0?'SHARE THE CODE WITH YOUR FRIEND':'')}
$('#lbHost').onclick=async()=>{lbMsg('creating room...');let c;try{for(let i=0;i<8;i++){c=String(Math.floor(1000+Math.random()*9000));if(!(await getDoc(doc(db,'rooms',c))).exists())break}
await setDoc(doc(db,'rooms',c),{host:CID,created:Date.now(),ev:[]})}catch(e){lbMsg('FIREBASE ERROR: '+(e.code||e.message)+' - enable Firestore and check rules');return}
lobReset();HOST=CID;me=0;online=true;room=RM;regH();await listen(c);enterRoom(c)};
$('#lbJoin').onclick=async()=>{const c=$('#lbCode').value.trim();if(!/^\d{4}$/.test(c)){lbMsg('ENTER A 4-DIGIT ROOM CODE');return}lbMsg('joining...');lobReset();room=RM;regH();let ok=false;try{ok=await listen(c)}catch(e){}
if(!ok){lbMsg('ROOM NOT FOUND');if(unsub)unsub();room=null;return}enterRoom(c);room.emit('join',{})};
$('#lbReady').onclick=()=>room.emit('ready',{});
$('#lbLocal').onclick=()=>{online=false;me=null;started=true;$('#lb').classList.remove('on');init()};
$('#lobbyBtn').onclick=()=>{if(unsub)unsub();unsub=null;room=null;online=false;me=null;started=false;lobReset();Object.assign(PL[0],AVS.m);Object.assign(PL[1],AVS.f);drawCards();
$('#l1').style.display='';$('#l2').style.display='none';lbMsg('');$('#mode').textContent='LOCAL (SAME SCREEN)';$('#lb').classList.add('on');init()};
/* ---- wiring ---- */
$('#cards').innerHTML=PL.map((p,i)=>`<div class="cw"><div class="badge" id="bd${i}"></div><div class="card box" id="c${i}"><canvas id="s${i}" width="48" height="56"></canvas><b style="color:${p.col}">${p.n}</b><span id="t${i}"></span></div></div>`).join('');
drawCards();
$('#roll').onclick=tryRoll;$('#die').onclick=tryRoll;$('#reset').onclick=doReset;$('#again').onclick=doReset;
$('#acc').onclick=()=>{if(online&&room)room.emit('accept',{});gotAcc()};
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊'};
buildBoard();init();
if(document.fonts)document.fonts.ready.then(()=>{buildBoard();draw()});
</script></body></html>
